name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --no-default-features --features cli -- -D warnings
      - name: Native library tests
        run: cargo nextest run --locked --workspace --all-features --lib
      - run: cargo test --locked --workspace --doc --all-features
      - run: cargo check --locked --workspace --no-default-features
      - run: cargo test --locked --package marklab --features wsi,cli --test wsi_integration

  backend-integration:
    name: backend-integration (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # About 190 test-minutes split six ways; the calibration profile runs weekly.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/target/pymc-venv
      MARKLAB_RUNTIME_ROOT: ${{ github.workspace }}
      MARKLAB_PYTHON: ${{ github.workspace }}/target/pymc-venv/bin/python
      MARKLAB_BACKEND_CACHE: ${{ github.workspace }}/target/pymc-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - name: Install the committed backend environment
        run: uv sync --project workers/python --locked --python 3.12
      - name: Build and admit the scientific runtime
        run: |
          cargo build --locked --package marklab --all-features --bin marklab
          target/debug/marklab backend doctor
      - name: Required workspace and real-backend integration tests
        run: >-
          cargo nextest run --locked --workspace --all-features --profile pr
          --partition hash:${{ matrix.shard }}/6 --test-threads 2 --no-fail-fast

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/target/pymc-venv
      MARKLAB_RUNTIME_ROOT: ${{ github.workspace }}
      MARKLAB_PYTHON: ${{ github.workspace }}/target/pymc-venv/bin/python
      MARKLAB_BACKEND_CACHE: ${{ github.workspace }}/target/pymc-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - name: Lint and format-check Python workers
        run: |
          uvx ruff@0.16.10 check workers/python
          uvx ruff@0.16.10 format --check workers/python
      - name: Install the committed backend environment
        run: uv sync --project workers/python --locked --python 3.12
      - name: Build and admit the scientific runtime
        run: |
          cargo build --locked --package marklab --all-features --bin marklab
          target/debug/marklab backend doctor
      - name: Python scientific and adapter regression tests
        run: |
          "$MARKLAB_PYTHON" -m unittest discover -s tests/python -p 'test_*.py'
          "$MARKLAB_PYTHON" -m unittest discover -s workers/python -p 'test_*.py'
      - name: Install the separately locked client test environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/target/client-venv
        run: uv sync --project clients/python --locked --group test --python 3.12
      - name: Required AnnData interchange and native client integration tests
        run: target/client-venv/bin/python -m unittest discover -s clients/python/tests -p 'test_*.py'

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: --no-default-features
          - name: all-features
            args: --all-features
          - name: csv-without-parquet
            args: --no-default-features --features csv
          - name: parquet-without-csv
            args: --no-default-features --features parquet
          - name: cli-without-defaults
            args: --no-default-features --features cli
          - name: wsi-without-cli
            args: --no-default-features --features wsi
          - name: wsi-cli
            args: --no-default-features --features wsi,cli
    name: feature-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - run: cargo check --locked --workspace --all-targets ${{ matrix.args }}

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      - run: cargo audit
      - run: cargo deny check advisories licenses bans sources
      - run: cargo machete
      - run: cargo package --locked --workspace

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz check --target x86_64-unknown-linux-gnu

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - name: Small production-workload smoke benchmark
        run: /usr/bin/time -v -o benchmark-resources.txt env MARKLAB_BENCH_PROFILE=smoke cargo bench --locked --workspace --all-features -- --quick
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-results
          path: |
            target/criterion
            benchmark-resources.txt

  heap-regression:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - run: cargo test --locked --package marklab --no-default-features --features dhat-heap --lib dhat_ -- --test-threads=1

  synthetic-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - run: cargo run --release --locked --package marklab --features wsi --bin marklab -- smoke --suite synthetic --replicates 10 --out smoke-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-smoke
          path: smoke-ci/smoke.json
