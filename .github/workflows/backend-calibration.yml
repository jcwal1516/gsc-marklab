name: Backend calibration

# The Bayesian calibration tests (simulation-based calibration, prior-sensitivity grids and
# PyMC/NumPyro agreement) left out of pull-request CI by the `pr` nextest profile.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

jobs:
  calibration-tests:
    runs-on: ubuntu-latest
    # About 150 test-minutes on two threads.
    timeout-minutes: 240
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/target/pymc-venv
      MARKLAB_RUNTIME_ROOT: ${{ github.workspace }}
      MARKLAB_PYTHON: ${{ github.workspace }}/target/pymc-venv/bin/python
      MARKLAB_BACKEND_CACHE: ${{ github.workspace }}/target/pymc-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - name: Install the committed backend environment
        run: uv sync --project workers/python --locked --python 3.12
      - name: Build and admit the scientific runtime
        run: |
          cargo build --locked --package marklab --all-features --bin marklab
          target/debug/marklab backend doctor
      - name: Bayesian calibration, sensitivity and agreement tests
        run: >-
          cargo nextest run --locked --workspace --all-features --profile calibration
          --test-threads 2 --no-fail-fast
