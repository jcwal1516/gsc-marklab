name: Full Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  production-workloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Full declared workloads
        run: /usr/bin/time -v -o benchmark-resources.txt env MARKLAB_BENCH_PROFILE=full cargo bench --locked --workspace --all-features
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-criterion-results
          path: |
            target/criterion
            benchmark-resources.txt
