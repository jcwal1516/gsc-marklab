[package]
name = "marklab-sbi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded simulation-based inference workflows for Marklab"

[lib]
bench = false

[dependencies]
marklab-simulation = { version = "0.1.0", path = "../marklab-simulation" }
rand = "=0.8.6"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
