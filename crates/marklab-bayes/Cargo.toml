[package]
name = "marklab-bayes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed Bayesian model and fit contracts for Marklab"

[lib]
bench = false

[dependencies]
rand = "=0.8.6"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
marklab-numerics = { version = "0.1.0", path = "../marklab-numerics" }
