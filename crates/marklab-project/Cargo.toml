[package]
name = "marklab-project"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content identity and minimal project state for Marklab"

[lib]
bench = false

[dependencies]
cap-std = "=4.0.3"
marklab-data = { version = "0.1.0", path = "../marklab-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
