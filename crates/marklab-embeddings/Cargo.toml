[package]
name = "marklab-embeddings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding artifacts and their CSV, Arrow and Parquet readers for Marklab"

[lib]
bench = false

[features]
default = []
csv = ["dep:csv"]
parquet = [
    "dep:arrow",
    "dep:arrow-ipc",
    "dep:bytes",
    "dep:flatbuffers",
    "dep:parquet",
    "dep:thrift",
]

[dependencies]
marklab-core.workspace = true
marklab-numerics.workspace = true
rand.workspace = true
rand_chacha.workspace = true
marklab-data.workspace = true
marklab-project.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
csv = { workspace = true, optional = true }
arrow = { version = "60", default-features = false, features = ["ipc"], optional = true }
arrow-ipc = { version = "60", optional = true }
bytes = { version = "=1.11.1", optional = true }
flatbuffers = { version = "25", optional = true }
parquet = { version = "=60.1.0", default-features = false, features = ["arrow"], optional = true }
thrift = { version = "=0.17.0", default-features = false, optional = true }

[dev-dependencies]
proptest.workspace = true
