[project]
name = "marklab-python-workers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cca-zoo[probabilistic]==3.0.0",
    "gudhi==3.13.0",
    "mofapy2==0.7.4",
    "numpyro==0.21.0",
    "pot==0.9.7.post1",
    "pymc==6.3.0",
    "sbi==0.26.1",
    "scikit-image==0.26.0",
    "shapely==2.1.2",
    "simpleitk==2.5.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Workers run as `python -P`, so they must extend sys.path before importing the support package.
"marklab_*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["marklab_worker_support"]
